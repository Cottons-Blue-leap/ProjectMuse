<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<style>
  @font-face { font-family: "GFSDidotLocal"; src: url("GFSDidot-Regular.ttf") format("truetype"); }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #0c0e12; font-family: "GFSDidotLocal", serif; display: flex; flex-direction: row;
         gap: 60px; padding: 60px; align-items: flex-start; }
  .col { display: flex; flex-direction: column; align-items: center; }
  .cap { width: 1080px; font-family: -apple-system,"Segoe UI",sans-serif; margin-bottom: 20px; }
  .cap .t { font-size: 30px; font-weight: 700; color: #5dcaa5; margin-bottom: 6px; }
  .cap .d { font-size: 32px; color: #e4e7ea; line-height: 1.3; }
  .cap .d b { color: #8fd9c4; }

  .frame { position: relative; width: 1080px; height: 1920px; overflow: hidden;
           background: radial-gradient(130% 80% at 50% 26%, #181d24 0%, #0c0e12 72%); }
  .didot { font-family: "GFSDidotLocal", serif; }
  .teal { color: rgb(40,180,175); }
  .cream { color: #e8e0c8; }

  .title { position: absolute; top: 130px; left: 0; right: 0; text-align: center; }
  .title .big { font-size: 84px; color: #f0ead8; letter-spacing: 0.08em; }
  .title .sub { font-size: 36px; color: #5dcaa5; letter-spacing: 0.18em; margin-top: 12px; }

  .stage { position: absolute; top: 360px; left: 0; right: 0; height: 700px; }
  .miku { position: absolute; bottom: 0; transform: translateX(-50%); text-align: center; transition: none; }
  .miku .gap { position: absolute; bottom: 100%; left: 50%; transform: translateX(-50%);
               font-size: 30px; color: #8fd9c4; letter-spacing: 0.1em; white-space: nowrap; margin-bottom: 10px; }
  .miku .note { position: absolute; bottom: 100%; left: 50%; transform: translateX(-50%);
                font-size: 64px; color: rgb(60,200,190); margin-bottom: 60px; }

  /* score */
  .score { position: absolute; left: 90px; right: 90px; top: 1180px; height: 280px; }
  .staffwrap { position: absolute; inset: 0; }
  .playhead { position: absolute; top: -120px; width: 4px; background: rgba(245,240,220,0.7);
              box-shadow: 0 0 16px rgba(245,240,220,0.6); }
  .drop { position: absolute; width: 2px; background: rgba(143,217,196,0.35); }

  .foot { position: absolute; left: 60px; right: 60px; bottom: 320px; text-align: center;
          font-size: 54px; color: #e8e0c8; letter-spacing: 0.03em; }
  .foot .n { color: rgb(40,180,175); }

  .ph-note { position: absolute; right: 70px; bottom: 250px; font-family:-apple-system,sans-serif;
             font-size: 24px; color:#6b7480; }
</style>
</head>
<body>
<div id="root"></div>
<script>
  // ---- geometry shared with score ----
  const SCORE_L = 90, SCORE_R = 990;          // px within 1080
  const BARS = 6, BARW = (SCORE_R - SCORE_L) / BARS; // 150
  const barCenter = b => SCORE_L + (b - 0.5) * BARW; // 1-indexed bar center
  const ENTRY_BARS = [1, 3, 5];               // miku entries, 2 bars apart

  // ---- Miku placeholder silhouette (→ replaced by 2차창작 art) ----
  function mikuSVG(active){
    const tail = active ? '#3cd0c4' : '#2a4a48';
    const dress = active ? '#23615c' : '#1a302e';
    const head = active ? '#efe7d6' : '#5a5e5c';
    const glow = active ? 'filter:drop-shadow(0 0 26px rgba(60,200,190,0.55));' : 'opacity:0.5;';
    return `<svg width="150" height="270" viewBox="0 0 120 216" style="${glow}">
      <path d="M30 56 C18 90 16 150 26 200 L40 200 C34 150 36 92 44 60 Z" fill="${tail}"/>
      <path d="M90 56 C102 90 104 150 94 200 L80 200 C86 150 84 92 76 60 Z" fill="${tail}"/>
      <path d="M60 78 L40 210 L80 210 Z" fill="${dress}"/>
      <rect x="54" y="64" width="12" height="20" fill="${head}"/>
      <circle cx="60" cy="46" r="26" fill="${head}"/>
      <path d="M36 40 C40 20 80 20 84 40 C84 30 70 22 60 22 C50 22 36 30 36 40 Z" fill="${tail}"/>
      <rect x="49" y="84" width="22" height="6" rx="3" fill="${active?'#3cd0c4':'#2a4a48'}"/>
    </svg>`;
  }

  function buildFrame(activeCount, playBar, capT, capD, footHTML){
    const phX = barCenter(playBar);
    let mikus = '';
    ENTRY_BARS.forEach((eb, i) => {
      const active = i < activeCount;
      const x = barCenter(eb);
      const gapLabel = i === 0 ? '' : `<div class="gap">↤ 2 bars</div>`;
      const noteMark = active ? `<div class="note">♪</div>` : '';
      mikus += `<div class="miku" style="left:${x}px;">
                  ${gapLabel}${noteMark}
                  <div class="badge"></div>${mikuSVG(active)}
                </div>`;
    });
    // drop lines from each entry bar (connect miku to score entry)
    let drops = '';
    ENTRY_BARS.forEach((eb,i) => {
      const x = barCenter(eb);
      drops += `<div class="drop" style="left:${x-90}px; top:-150px; height:150px;"></div>`;
    });
    return `<div class="col">
      <div class="cap"><div class="t">${capT}</div><div class="d">${capD}</div></div>
      <div class="frame">
        <div class="title"><div class="big didot">CANON</div><div class="sub didot">A ROUND, 2 BARS APART</div></div>
        <div class="stage">${mikus}</div>
        <div class="score">
          <div class="staffwrap">${staffSVG()}</div>
          ${drops}
          <div class="playhead" style="left:${phX-90}px;"></div>
        </div>
        <div class="ph-note">placeholder: 미쿠=2차창작 / 악보=실제 캐논 악보로 교체</div>
        <div class="foot didot">${footHTML}</div>
      </div></div>`;
  }

  function staffSVG(){
    const W = SCORE_R - SCORE_L, H = 280;
    let lines = '';
    for(let i=0;i<5;i++){ const y=60+i*26; lines += `<line x1="0" y1="${y}" x2="${W}" y2="${y}" stroke="#5c6470" stroke-width="2"/>`; }
    let bars = '';
    for(let b=0;b<=BARS;b++){ const x=b*BARW; bars += `<line x1="${x}" y1="60" x2="${x}" y2="164" stroke="#4a525c" stroke-width="2"/>`; }
    // simple note heads along a contour
    const contour=[3,2,1,2,3,4,3,2, 1,2,3,2,1,0,1,2];
    let notes='';
    const per = W / contour.length;
    contour.forEach((p,i)=>{ const x= i*per + per/2; const y=60+ (4-p*0.9)*26*0.9 + 20;
      notes += `<ellipse cx="${x}" cy="${y}" rx="11" ry="8" fill="#d8d2c4" transform="rotate(-18 ${x} ${y})"/>
                <line x1="${x+10}" y1="${y}" x2="${x+10}" y2="${y-44}" stroke="#d8d2c4" stroke-width="2.5"/>`; });
    // treble clef-ish mark
    const clef = `<text x="6" y="120" font-size="78" fill="#cfc9bb" font-family="serif">𝄞</text>`;
    return `<svg width="${W}" height="${H}" viewBox="0 0 ${W} ${H}">${lines}${bars}${clef}${notes}</svg>`;
  }

  document.getElementById('root').innerHTML =
    buildFrame(1, 1, '~0:00 · MIKU 1', '첫 미쿠가 노래 시작 (악보 재생 따라)', '<span class="n">1</span>번 입장') +
    buildFrame(2, 3, '~0:08 · MIKU 2 (+2 bars)', '<b>2마디 뒤</b> 둘째 미쿠 입장 — 간격이 눈에 보임', '<span class="n">2</span>명 · 2마디 간격') +
    buildFrame(3, 5, '~0:20 · MIKU 3 · 돌림노래 완성', '세 미쿠가 2마디씩 어긋나 화음 = <b>캐논</b>', 'sung by <span class="n">Hatsune Miku</span>');
</script>
</body>
</html>
