<!DOCTYPE html><html><head><meta charset="UTF-8"><style>
  *{margin:0;padding:0;box-sizing:border-box;}
  body{background:transparent;}
  .cell{width:800px;height:1400px;position:relative;}
</style></head><body>
<div class="cell" id="wait"></div>
<div class="cell" id="sing"></div>
<script>
  // Placeholder Miku silhouette (→ replaced by 코튼 2차창작 PNG).
  // 2 states: wait (eyes closed, calm) / sing (eyes open, mouth open, ♪).
  function miku(state){
    const active = state==='sing';
    const tail = active ? '#3cd0c4' : '#7fb8b2';
    const dress = active ? '#23615c' : '#3a6460';
    const skin = '#f1e2d2';
    const hair = active ? '#39c8be' : '#5fb0a8';
    // eyes/mouth
    const eyes = active
      ? '<circle cx="150" cy="232" r="9" fill="#1c2b2a"/><circle cx="210" cy="232" r="9" fill="#1c2b2a"/>'
      : '<path d="M141 233 h18" stroke="#1c2b2a" stroke-width="6" stroke-linecap="round"/><path d="M201 233 h18" stroke="#1c2b2a" stroke-width="6" stroke-linecap="round"/>';
    const mouth = active
      ? '<ellipse cx="180" cy="262" rx="11" ry="14" fill="#9c4a44"/>'
      : '<path d="M170 262 q10 8 20 0" stroke="#9c4a44" stroke-width="5" fill="none" stroke-linecap="round"/>';
    const noteMark = active
      ? '<text x="298" y="150" font-size="78" fill="#3cd0c4" font-family="serif">♪</text>' : '';
    return `<svg width="800" height="1400" viewBox="0 0 360 640">
      ${noteMark}
      <!-- twintails -->
      <path d="M96 210 C60 320 56 520 78 700 L120 700 C100 520 104 330 128 224 Z" fill="${tail}"/>
      <path d="M264 210 C300 320 304 520 282 700 L240 700 C260 520 256 330 232 224 Z" fill="${tail}"/>
      <!-- dress -->
      <path d="M180 300 L120 720 L240 720 Z" fill="${dress}"/>
      <!-- neck -->
      <rect x="166" y="278" width="28" height="40" fill="${skin}"/>
      <!-- head -->
      <circle cx="180" cy="220" r="74" fill="${skin}"/>
      <!-- hair top + bangs -->
      <path d="M108 200 C112 132 248 132 252 200 C252 168 226 140 180 140 C134 140 108 168 108 200 Z" fill="${hair}"/>
      <path d="M118 205 q26 26 0 56 q-14 -28 0 -56 Z" fill="${hair}"/>
      <path d="M242 205 q-26 26 0 56 q14 -28 0 -56 Z" fill="${hair}"/>
      <!-- tie -->
      <rect x="160" y="312" width="40" height="12" rx="6" fill="${active?'#3cd0c4':'#7fb8b2'}"/>
      ${eyes}${mouth}
    </svg>`;
  }
  document.getElementById('wait').innerHTML = miku('wait');
  document.getElementById('sing').innerHTML = miku('sing');
</script>
</body></html>
