<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<style>
  @font-face {
    font-family: "GFSDidotLocal";
    src: url("../h2_cold_open/public/fonts/GFSDidot-Regular.ttf") format("truetype");
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #15171b;
    font-family: "GFSDidotLocal", serif;
    display: flex; flex-direction: row; gap: 70px; padding: 70px; align-items: flex-start;
  }
  .col { display: flex; flex-direction: column; align-items: center; }
  .caption { width: 1080px; color: #cfd6dc; font-family: -apple-system,"Segoe UI",sans-serif; margin-bottom: 22px; }
  .caption .tag { font-size: 30px; font-weight: 700; letter-spacing: 0.04em; color: #5dcaa5; text-transform: uppercase; margin-bottom: 8px; }
  .caption .name { font-size: 44px; font-weight: 700; color: #f2efe6; margin-bottom: 6px; }
  .caption .stop { font-size: 30px; color: #9aa6b0; }
  .caption .stop b { color: #e8e0c8; font-weight: 600; }

  .frame { position: relative; width: 1080px; height: 1920px; overflow: hidden; background: #0c1014; }
  .hero { position: absolute; inset: 0; background-image: url("hero_miku_crop.png"); background-size: cover; background-position: 50% 26%; }
  .scrim-top { position: absolute; top: 0; left: 0; right: 0; height: 480px; background: linear-gradient(180deg, rgba(8,12,16,0.66) 0%, rgba(8,12,16,0) 100%); }
  .scrim-bot { position: absolute; bottom: 0; left: 0; right: 0; height: 840px; background: linear-gradient(0deg, rgba(8,12,16,0.88) 16%, rgba(8,12,16,0) 100%); }

  .didot { font-family: "GFSDidotLocal", serif; color: #e8e0c8; }
  .teal { color: rgb(40,180,175); }
  .shadow { text-shadow: 0 3px 22px rgba(0,0,0,0.85); }

  .topline { position: absolute; top: 290px; left: 60px; right: 60px; text-align: center; font-size: 38px; letter-spacing: 0.18em; opacity: 0.82; }

  /* α — a cappella hero word */
  .alpha .miku { position: absolute; left: 60px; right: 60px; bottom: 560px; text-align: center; font-size: 52px; letter-spacing: 0.10em; }
  .alpha .acap { position: absolute; left: 60px; right: 60px; bottom: 360px; text-align: center; font-size: 118px; letter-spacing: 0.06em; }

  /* β — 100% MIKU numeric punch */
  .beta .pct { position: absolute; left: 60px; right: 60px; bottom: 560px; text-align: center; font-size: 116px; line-height: 1; letter-spacing: 0.02em; }
  .beta .acap { position: absolute; left: 60px; right: 60px; bottom: 480px; text-align: center; font-size: 46px; letter-spacing: 0.18em; opacity: 0.86; white-space: nowrap; }
</style>
</head>
<body>

  <!-- α -->
  <div class="col">
    <div class="caption">
      <div class="tag">LM · α — "a cappella" 히어로</div>
      <div class="name">단어 2개로 끝</div>
      <div class="stop">텍스트 = <b>"a cappella"(악기없음 전세계 통용어) + MIKU</b> · 영어 문장 0</div>
    </div>
    <div class="frame alpha">
      <div class="hero"></div>
      <div class="scrim-top"></div>
      <div class="scrim-bot"></div>
      <div class="topline didot shadow">ERIK SATIE &nbsp;·&nbsp; GYMNOPÉDIE No. 1</div>
      <div class="miku didot shadow"><span class="teal">Hatsune Miku</span></div>
      <div class="acap didot shadow">A CAPPELLA</div>
    </div>
  </div>

  <!-- β -->
  <div class="col">
    <div class="caption">
      <div class="tag">LM · β — "100% MIKU" 숫자 펀치</div>
      <div class="name">숫자(만국공통) + 이름</div>
      <div class="stop">텍스트 = <b>100% + MIKU + a cappella</b> · 숫자가 훅, 문장 0</div>
    </div>
    <div class="frame beta">
      <div class="hero"></div>
      <div class="scrim-top"></div>
      <div class="scrim-bot"></div>
      <div class="topline didot shadow">ERIK SATIE &nbsp;·&nbsp; GYMNOPÉDIE No. 1</div>
      <div class="pct didot shadow"><span class="teal">100%</span> MIKU</div>
      <div class="acap didot shadow">A CAPPELLA</div>
    </div>
  </div>

</body>
</html>
